{% extends 'encyclopedia/layout.html' %}
{% load markdown_extras %}

{% block title %}
    Search
{% endblock title %}

{% block body %}
    {% if pages %}
        <h1>Suggested Results</h1>
        <ul>
            {% for page in pages %}
                <li><a href="{% url 'wiki' page %}">{{ page }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        <h1>No Results To Show</h1>
    {% endif %}
{% endblock body %}
