{% extends "encyclopedia/layout.html" %}

{% block title %}
    Edit Page
{% endblock title %}

{% block body %}
    <h1>Edit a Page</h1>
    <form action="{% url 'edit_page' title %}" method="POST">
        {% csrf_token %}
        {% if error %}
            <h1 style="color: red;">{{ error }}!!</h1>
        {% endif %}
        {{ form }}
        <input type="submit"/>
    </form>
{% endblock body %}
